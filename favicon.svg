<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="star-grad" x1="6" y1="6" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#e879f9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1033"/>
      <stop offset="100%" stop-color="#080812"/>
    </radialGradient>
    <filter id="star-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#bg-grad)"/>
  <circle cx="50" cy="50" r="47" stroke="url(#star-grad)" stroke-width="0.8" fill="none" opacity="0.4"/>

  <polygon
    points="50,6 57.5,41 94,50 57.5,59 50,94 42.5,59 6,50 42.5,41"
    fill="url(#star-grad)"
    filter="url(#star-glow)"
  />

  <polygon
    points="50,26 54.5,44.5 73,50 54.5,55.5 50,74 45.5,55.5 27,50 45.5,44.5"
    fill="url(#star-grad)"
    opacity="0.45"
  />

  <circle cx="50" cy="50" r="20" fill="url(#core-glow)"/>
  <circle cx="50" cy="50" r="5" fill="white" opacity="0.95"/>
</svg>
